<title>BASA Intervalos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Colores de BASA: blanco, negro, naranja y marrón. En el entrenamiento el fondo entero es el color de la fase. */
:root{
  --bg:#ffffff; --surface:#f4f2ef; --surface2:#e9e5e0; --line:#e2ddd6;
  --fg:#000000; --muted:#6e6760;
  --orange:#ef7a13; --brown:#883409; --black:#000000; --white:#ffffff;
  --brand:var(--orange);
  --danger:#c62f12;
  --f-display:'Helvetica Neue',Helvetica,Arial,system-ui,sans-serif;
  --f-ui:'Helvetica Neue',Helvetica,Arial,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 var(--f-ui);-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
input,textarea{font:inherit;color:var(--fg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}

/* ---------- Inicio ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 22px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:56px;height:auto;flex:none;display:block}
.brand-txt{display:flex;flex-direction:column;line-height:1.05}
.brand-txt b{font:500 26px/1 var(--f-display);letter-spacing:-.01em}
.brand-txt span{font-size:14px;color:var(--muted);margin-top:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--surface2)}
.btn.primary{background:var(--black);color:var(--white)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.list{display:grid;gap:12px}
.card{background:var(--surface);border-radius:16px;overflow:hidden}
.card-main{display:grid;grid-template-columns:1fr auto;grid-template-areas:"name play" "meta play" "total play";gap:2px 14px;width:100%;text-align:left;padding:16px 16px 12px}
.card-name{grid-area:name;font:500 28px/1.1 var(--f-display);letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
.card-meta{grid-area:meta;color:var(--muted);font-size:15px}
.card-total{grid-area:total;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;color:var(--brown);margin-top:4px}
.card-play{grid-area:play;align-self:center;width:60px;height:60px;border-radius:50%;background:var(--orange);color:var(--black);display:grid;place-items:center}
.card-play svg{width:26px;height:26px;margin-left:3px}
.card-actions{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.card-actions button{min-height:46px;color:var(--muted);font-size:15px;font-weight:600}
.card-actions button+button{border-left:1px solid var(--line)}
.card-actions button.danger{color:var(--danger)}
.foot{margin-top:22px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.linkbtn{color:var(--muted);font-size:15px;text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 8px}

/* ---------- Editor ---------- */
.ed-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 16px}
.ed-head h2{font:500 30px/1 var(--f-display);letter-spacing:-.01em;margin:0}
.lbl{display:block;color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.txt{width:100%;min-height:52px;padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:18px}
.fields{display:grid;gap:10px;margin-top:18px}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-radius:12px;padding:8px 8px 8px 14px}
.field label{font-weight:500;min-width:0}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{width:44px;height:44px;border-radius:10px;background:var(--white);border:1px solid var(--line);font-size:24px;line-height:1}
.stepper input{width:56px;height:44px;text-align:center;background:transparent;border:0;font:600 21px var(--f-display);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.unit{color:var(--muted);font-size:14px;width:12px}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 8px}
.sec-h h3{margin:0;font:500 22px var(--f-display)}
.hint{color:var(--muted);font-size:14px;margin:0 0 10px}
.ex-list{display:grid;gap:8px}
.ex-row{display:grid;grid-template-columns:28px 1fr 64px 14px;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:6px 10px}
.ex-num{font-weight:700;font-size:17px;color:var(--orange);text-align:center}
.ex-name,.ex-dur{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--white);padding:0 10px;min-width:0;font-size:16px}
.ex-dur{text-align:center;font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.ed-total{margin-top:18px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.ed-actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:18px}

/* ---------- Copia de seguridad ---------- */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet-in{width:100%;max-width:560px;background:var(--bg);border-radius:20px 20px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-height:90%;overflow:auto;display:grid;gap:10px}
.sheet h2{margin:0;font:500 26px var(--f-display)}
.sheet textarea{width:100%;min-height:110px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.msg{min-height:20px;color:var(--brown);font-size:14px;font-weight:600}

/* ---------- Entrenamiento ---------- */
body[data-view="run"]{background:var(--phase);color:var(--on);transition:background-color .35s}
body[data-phase="prep"]{--phase:var(--white);--on:var(--black);--hi:var(--orange)}
body[data-phase="work"]{--phase:var(--orange);--on:var(--black);--hi:var(--black)}
body[data-phase="rest"]{--phase:var(--brown);--on:var(--white);--hi:var(--white)}
body[data-phase="roundrest"]{--phase:var(--black);--on:var(--white);--hi:var(--orange)}
body[data-phase="done"]{--phase:var(--white);--on:var(--black);--hi:var(--orange)}
#run{height:100%;display:flex;flex-direction:column;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:6px 10px;user-select:none;-webkit-user-select:none;max-width:640px;margin:0 auto}
.tint{background:rgba(127,127,127,.18)}
.run-top{display:flex;align-items:center;gap:8px}
.ibtn{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:rgba(127,127,127,.18);flex:none}
.ibtn svg{width:24px;height:24px}
.ibtn.off{opacity:.4}
.ibtn.armed{background:var(--on);color:var(--phase)}
.run-name{flex:1;min-width:0;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.run-mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:0;gap:4px}
.phase{font:700 clamp(28px,8.5vw,46px)/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;color:var(--hi)}
.exname{font:500 clamp(26px,8vw,42px)/1.05 var(--f-display);max-width:100%;overflow-wrap:anywhere;min-height:1.05em}
.timer{font:500 min(42vw,32vh)/.9 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.04em;margin:4px 0}
.timer.long{font-size:min(30vw,26vh)}
.bar{width:100%;height:10px;border-radius:5px;background:rgba(127,127,127,.25);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--on);border-radius:5px}
.counts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.pill{background:rgba(127,127,127,.18);border-radius:999px;padding:7px 15px;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.next{font-size:18px;font-weight:600;margin-top:10px;min-height:1.4em;max-width:100%}
.left{font-size:15px;font-weight:500;opacity:.75;font-variant-numeric:tabular-nums;min-height:1.4em}
.state{font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.1em;min-height:1.2em}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:10px 4px}
.cbtn{justify-self:center;width:78px;height:78px;border-radius:50%;background:rgba(127,127,127,.2);display:grid;place-items:center}
.cbtn svg{width:34px;height:34px}
.cbtn.big{width:116px;height:116px;background:var(--on);color:var(--phase)}
.cbtn.big svg{width:52px;height:52px}
.run-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:6px}
.chip{min-height:44px;padding:0 14px;border-radius:12px;background:rgba(127,127,127,.18);font-weight:600;font-size:15px}
.chip.armed{background:var(--on);color:var(--phase)}
.note{font-size:13px;opacity:.8;text-align:center;min-height:1.2em;padding-top:4px}
@media (max-height:640px){.cbtn{width:64px;height:64px}.cbtn.big{width:92px;height:92px}.counts{margin-top:6px}}
@media (prefers-reduced-motion:reduce){body{transition:none!important}}
</style>
</head>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const LS='intervalos.v1';
const uid=()=>Math.random().toString(36).slice(2,10);
const clampInt=(v,min,max)=>{v=Math.round(Number(v));if(!isFinite(v))v=min;return Math.min(max,Math.max(min,v));};
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};

/* ---------- Datos ---------- */
function mk(name,work,n=5){return{id:uid(),name,prep:5,work,rest:25,rounds:2,roundRest:60,exercises:Array.from({length:n},()=>({name:'',dur:work}))};}
const S={circuits:[],settings:{sound:true,voice:false,music:'mix'}};
try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d&&Array.isArray(d.circuits)){S.circuits=d.circuits;Object.assign(S.settings,d.settings||{});}}catch(e){}
if(!S.settings.v2){S.settings.voice=false;S.settings.v2=true;}
if(S.settings.music!=='remote')S.settings.music='mix';
if(!S.circuits.length)S.circuits=[mk('40/25',40),mk('50/25',50)];
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function sanitize(c){const ex=Array.isArray(c.exercises)&&c.exercises.length?c.exercises:[{name:'',dur:40}];
  return{id:uid(),name:String(c.name||'Circuito').slice(0,40),prep:clampInt(c.prep??5,0,600),work:clampInt(c.work??ex[0].dur??40,5,3600),rest:clampInt(c.rest??25,0,600),rounds:clampInt(c.rounds??2,1,30),roundRest:clampInt(c.roundRest??60,0,1800),
  exercises:ex.slice(0,30).map(e=>({name:String(e.name||'').slice(0,40),dur:clampInt(e.dur??40,5,3600)}))};}

/* Secuencia: tras el último ejercicio de la ronda va directo al descanso entre rondas; tras la última ronda, fin. */
function buildPhases(c){const P=[],n=c.exercises.length;
  if(c.prep>0)P.push({type:'prep',dur:c.prep,ex:0,round:1});
  for(let r=1;r<=c.rounds;r++)for(let i=0;i<n;i++){
    P.push({type:'work',dur:c.exercises[i].dur,ex:i,round:r});
    if(i<n-1){if(c.rest>0)P.push({type:'rest',dur:c.rest,ex:i+1,round:r});}
    else if(r<c.rounds&&c.roundRest>0)P.push({type:'roundrest',dur:c.roundRest,ex:0,round:r+1});
  }return P;}
const totalSecs=c=>buildPhases(c).reduce((a,p)=>a+p.dur,0);

function show(v){for(const id of['home','editor','run'])$('#'+id).hidden=id!==v;document.body.dataset.view=v;window.scrollTo(0,0);}

/* ---------- Inicio ---------- */
function renderHome(){const list=$('#list');list.innerHTML='';
  S.circuits.forEach(c=>{const n=c.exercises.length,durs=[...new Set(c.exercises.map(e=>e.dur))];
    const el=document.createElement('article');el.className='card';
    el.innerHTML=`<button class="card-main" type="button" data-act="play"><span class="card-name"></span><span class="card-meta">${durs.length===1?`${n} × ${durs[0]} s`:`${n} ejercicios`} · descanso ${c.rest} s · ${c.rounds} ${c.rounds===1?'ronda':'rondas'}</span><span class="card-total">Total ${fmt(totalSecs(c))}</span><span class="card-play" aria-hidden="true"><svg><use href="#i-play"/></svg></span></button><div class="card-actions"><button type="button" data-act="edit">Editar</button><button type="button" data-act="dup">Duplicar</button><button type="button" data-act="del">Eliminar</button></div>`;
    el.querySelector('.card-name').textContent=c.name;
    el.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)cardAction(b.dataset.act,c,b);});
    list.appendChild(el);});}
function cardAction(a,c,b){
  if(a==='play')openRun(c);
  else if(a==='edit')openEditor(c);
  else if(a==='dup'){const d=JSON.parse(JSON.stringify(c));d.id=uid();d.name=(c.name+' (copia)').slice(0,40);S.circuits.splice(S.circuits.indexOf(c)+1,0,d);save();renderHome();}
  else if(a==='del'){if(b.dataset.armed){S.circuits=S.circuits.filter(x=>x!==c);save();renderHome();}
    else{b.dataset.armed='1';b.textContent='¿Seguro?';b.classList.add('danger');setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Eliminar';b.classList.remove('danger');}},3000);}}
}
$('#btn-new').onclick=()=>openEditor(null);

/* ---------- Editor ---------- */
const FIELDS=[['nex','Ejercicios por ronda','',1,30,1],['work','Duración de cada ejercicio','s',5,3600,5],['rest','Descanso entre ejercicios','s',0,600,5],['rounds','Rondas','',1,30,1],['roundRest','Descanso entre rondas','s',0,1800,5],['prep','Cuenta atrás inicial','s',0,600,5]];
let draft=null,editIdx=-1;
function openEditor(c){editIdx=c?S.circuits.indexOf(c):-1;draft=c?JSON.parse(JSON.stringify(c)):mk('',40);renderEditor();show('editor');}
function renderEditor(){$('#ed-title').textContent=editIdx<0?'Nuevo circuito':'Editar circuito';$('#ed-name').value=draft.name;
  const f=$('#ed-fields');f.innerHTML='';
  for(const[k,label,unit,min,max,step]of FIELDS){const val=k==='nex'?draft.exercises.length:draft[k];const row=document.createElement('div');row.className='field';
    row.innerHTML=`<label for="f-${k}">${label}</label><div class="stepper"><button type="button" data-k="${k}" data-d="${-step}" aria-label="Menos">−</button><input id="f-${k}" type="number" inputmode="numeric" min="${min}" max="${max}" value="${val}" data-k="${k}"><span class="unit">${unit}</span><button type="button" data-k="${k}" data-d="${step}" aria-label="Más">+</button></div>`;
    f.appendChild(row);}
  renderExList();renderEdTotal();}
function setField(k,v){const fd=FIELDS.find(x=>x[0]===k);v=clampInt(v,fd[3],fd[4]);
  if(k==='nex'){const ex=draft.exercises;while(ex.length<v)ex.push({name:'',dur:draft.work});ex.length=v;renderExList();}
  else{draft[k]=v;if(k==='work'){draft.exercises.forEach(e=>e.dur=v);renderExList();}}
  $('#f-'+k).value=v;renderEdTotal();}
$('#ed-fields').addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(!b)return;const k=b.dataset.k;setField(k,Number($('#f-'+k).value)+Number(b.dataset.d));});
$('#ed-fields').addEventListener('change',e=>{if(e.target.dataset.k)setField(e.target.dataset.k,e.target.value);});
function renderExList(){const box=$('#ed-ex');box.innerHTML='';
  draft.exercises.forEach((e,i)=>{const r=document.createElement('div');r.className='ex-row';
    r.innerHTML=`<span class="ex-num">${i+1}</span><input id="ex-n-${i}" class="ex-name" type="text" maxlength="40" placeholder="Ejercicio ${i+1}" data-i="${i}" aria-label="Nombre del ejercicio ${i+1}" autocomplete="off"><input id="ex-d-${i}" class="ex-dur" type="number" inputmode="numeric" min="5" max="3600" data-i="${i}" aria-label="Segundos del ejercicio ${i+1}"><span class="unit">s</span>`;
    r.querySelector('.ex-name').value=e.name;r.querySelector('.ex-dur').value=e.dur;box.appendChild(r);});}
$('#ed-ex').addEventListener('input',e=>{if(e.target.classList.contains('ex-name'))draft.exercises[e.target.dataset.i].name=e.target.value;});
$('#ed-ex').addEventListener('change',e=>{if(e.target.classList.contains('ex-dur')){const v=clampInt(e.target.value,5,3600);draft.exercises[e.target.dataset.i].dur=v;e.target.value=v;renderEdTotal();}});
function renderEdTotal(){$('#ed-total').textContent='Duración total: '+fmt(totalSecs(draft));}
$('#ed-cancel').onclick=()=>{renderHome();show('home');};
$('#ed-save').onclick=()=>{draft.name=$('#ed-name').value.trim()||'Circuito sin nombre';draft.exercises.forEach(e=>e.name=e.name.trim());
  if(editIdx<0)S.circuits.push(draft);else S.circuits[editIdx]=draft;save();renderHome();show('home');};

/* ---------- Copia de seguridad ---------- */
$('#btn-backup').onclick=()=>{$('#bk-out').value=JSON.stringify(S.circuits.map(({id,...c})=>c),null,1);$('#bk-in').value='';$('#bk-msg').textContent='';$('#backup').hidden=false;};
$('#bk-close').onclick=()=>{$('#backup').hidden=true;};
$('#bk-copy').onclick=()=>{const t=$('#bk-out');const ok=()=>{$('#bk-msg').textContent='Copiado.';};
  try{navigator.clipboard.writeText(t.value).then(ok,()=>{t.select();$('#bk-msg').textContent='Texto seleccionado: cópialo manualmente.';});}catch(e){t.select();}};
$('#bk-import').onclick=()=>{try{let d=JSON.parse($('#bk-in').value);if(!Array.isArray(d))d=[d];const add=d.map(sanitize);if(!add.length)throw 0;
  S.circuits.push(...add);save();renderHome();$('#bk-msg').textContent=`Importados ${add.length} circuito${add.length>1?'s':''}.`;}
  catch(e){$('#bk-msg').textContent='No se pudo leer. Pega el texto completo tal como lo copiaste.';}};

/* ---------- Audio ---------- */
/* 'mix' (ambient): música en este móvil; los avisos suenan encima sin cortarla (se silencia con el interruptor de silencio).
   'remote' (playback): música en otro altavoz; el móvil reproduce los avisos como sonido principal, también en modo silencio. */
let ctx=null,master=null,scheduled=[],track=true,primed=false;
function applySession(){try{const t=S.settings.music==='remote'?'playback':'ambient';if(navigator.audioSession&&navigator.audioSession.type!==t)navigator.audioSession.type=t;}catch(e){}}
applySession();
function ensureAudio(){applySession();
  if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-10;comp.ratio.value=4;
    master=ctx.createGain();master.gain.value=1;master.connect(comp);comp.connect(ctx.destination);}
  if(ctx.state!=='running')ctx.resume().catch(()=>{});
  if(!primed&&'speechSynthesis' in window){primed=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}}}
function tone(freq,when,dur,type='square',vol=.35){if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;
  const t=Math.max(ctx.currentTime,when);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.setValueAtTime(vol,t+Math.max(.02,dur-.04));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
  if(track){scheduled.push(o);o.onended=()=>{const k=scheduled.indexOf(o);if(k>=0)scheduled.splice(k,1);};}}
function cancelSounds(){for(const o of scheduled){try{o.onended=null;o.stop();}catch(e){}}scheduled=[];}
const SND={
  count:t=>tone(1760,t,.14,'square',.5),
  work:t=>{tone(1318,t,.16,'square',.55);tone(1976,t+.18,.55,'square',.55);},
  rest:t=>{tone(1175,t,.22,'square',.5);tone(784,t+.25,.6,'square',.5);},
  round:t=>{[1046,1318,1568].forEach((f,i)=>tone(f,t+i*.15,.2,'square',.5));tone(2093,t+.48,.7,'square',.5);},
  finish:t=>{[1046,1318,1568,2093].forEach((f,i)=>tone(f,t+i*.14,.2,'square',.5));[1568,2093].forEach(f=>tone(f,t+.62,1.1,'square',.4));},
};
const startSnd=p=>p.type==='work'?SND.work:p.type==='rest'?SND.rest:p.type==='roundrest'?SND.round:null;
function playNow(fn){if(!fn||!S.settings.sound||!ctx)return;track=false;fn(ctx.currentTime+.02);track=true;}
/* Se programan en el reloj de audio la cuenta atrás de los 5 últimos segundos y la señal de la fase siguiente. */
function scheduleAudio(cancelFirst){if(cancelFirst)cancelSounds();if(!S.settings.sound||!R||!R.running||!ctx)return;
  const rem=(R.endAt-Date.now())/1000;if(rem<=0)return;const base=ctx.currentTime,p=R.phases[R.idx];
  for(let k=Math.min(5,Math.floor(p.dur));k>=1;k--){const t=rem-k;if(t>.03)SND.count(base+t);}
  const next=R.phases[R.idx+1];if(!next)SND.finish(base+rem);else{const s=startSnd(next);if(s)s(base+rem);}}

/* ---------- Voz ---------- */
let voice=null,speakTimer=0;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>v.lang==='es-ES')||vs.find(v=>/^es/i.test(v.lang))||null;}catch(e){}}
if('speechSynthesis' in window){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}}
function speak(txt,delay=650){clearTimeout(speakTimer);if(!S.settings.voice||!txt||!('speechSynthesis' in window))return;
  speakTimer=setTimeout(()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='es-ES';u.rate=1.05;if(voice)u.voice=voice;speechSynthesis.speak(u);}catch(e){}},delay);}
function stopSpeech(){clearTimeout(speakTimer);try{speechSynthesis.cancel();}catch(e){}}

/* ---------- Pantalla encendida ---------- */
let wl=null;
async function lockWake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;});}}catch(e){wl=null;}}
function releaseWake(){try{if(wl)wl.release();}catch(e){}wl=null;}

/* ---------- Entrenamiento ---------- */
let R=null;
const LABEL={prep:'Prepárate',work:'Ejercicio',rest:'Descanso',roundrest:'Descanso entre rondas'};
const exName=i=>(R.c.exercises[i]&&R.c.exercises[i].name.trim())||('Ejercicio '+(i+1));
function phaseSpeech(p){switch(p.type){
  case'prep':return'Prepárate. Primero, '+exName(0);
  case'work':return R.c.exercises[p.ex].name.trim()||(p.ex===0?'Ronda '+p.round:'');
  case'rest':return'Descanso. Siguiente, '+exName(p.ex);
  case'roundrest':return'Ronda '+(p.round-1)+' terminada. '+(p.round===R.c.rounds?'Siguiente, última ronda':'Siguiente, ronda '+p.round);}}
function openRun(c){R={c,phases:buildPhases(c),idx:0,running:false,endAt:0,remain:0,done:false,started:false};R.remain=R.phases[0].dur*1000;show('run');renderRun();}
function remainingMs(){return R.running?Math.max(0,R.endAt-Date.now()):R.remain;}
function resume(){ensureAudio();
  if(R.done){R.done=false;R.idx=0;R.remain=R.phases[0].dur*1000;}
  const p=R.phases[R.idx],fresh=R.remain>=p.dur*1000;
  R.running=true;R.started=true;R.endAt=Date.now()+R.remain;
  scheduleAudio(true);if(fresh){playNow(startSnd(p));speak(phaseSpeech(p),p.type==='prep'?0:650);}
  lockWake();renderRun();}
function pause(){R.remain=remainingMs();R.running=false;cancelSounds();stopSpeech();renderRun();}
function advance(auto){const prevEnd=R.endAt;R.idx++;
  if(R.idx>=R.phases.length){finish(auto);return;}
  const p=R.phases[R.idx];R.remain=p.dur*1000;R.endAt=auto?prevEnd+p.dur*1000:Date.now()+p.dur*1000;
  if(auto){if(R.endAt>Date.now()){scheduleAudio(false);speak(phaseSpeech(p));}}
  else{scheduleAudio(true);playNow(startSnd(p));speak(phaseSpeech(p));}
  renderRun();}
function finish(auto){R.running=false;if(!auto){cancelSounds();playNow(SND.finish);}speak('Entrenamiento terminado. Buen trabajo.',auto?900:1200);
  R.done=true;R.started=false;R.idx=0;R.remain=R.phases[0].dur*1000;releaseWake();renderRun();}
function skip(){if(R.idx>=R.phases.length-1){if(R.running||R.started)finish(false);return;}
  if(R.running)advance(false);else{R.idx++;R.remain=R.phases[R.idx].dur*1000;R.done=false;renderRun();}}
function restartPhase(){const p=R.phases[R.idx];R.remain=p.dur*1000;R.done=false;
  if(R.running){R.endAt=Date.now()+R.remain;scheduleAudio(true);playNow(startSnd(p));speak(phaseSpeech(p));}renderRun();}
function resetAll(){cancelSounds();stopSpeech();R.running=false;R.started=false;R.done=false;R.idx=0;R.remain=R.phases[0].dur*1000;releaseWake();renderRun();}
function exitRun(){if(R){cancelSounds();stopSpeech();R.running=false;}R=null;releaseWake();delete document.body.dataset.phase;renderHome();show('home');}
function tick(){if(!R||!R.running)return;let g=0;while(R&&R.running&&Date.now()>=R.endAt&&g++<2000)advance(true);if(R)renderTime();}
setInterval(tick,200);
(function loop(){tick();requestAnimationFrame(loop);})();

function nextText(){const p=R.phases[R.idx];if(R.done)return'Pulsa ▶ para empezar de nuevo';
  if(p.type!=='work')return'Siguiente: '+exName(p.ex)+(p.type==='roundrest'?` · Ronda ${p.round}`:'');
  for(let j=R.idx+1;j<R.phases.length;j++){const q=R.phases[j];if(q.type==='work')return'Siguiente: '+exName(q.ex)+(q.round!==p.round?` · Ronda ${q.round}`:'');}
  return'Último ejercicio';}
function renderRun(){if(!R)return;const p=R.phases[R.idx],n=R.c.exercises.length;
  document.body.dataset.phase=R.done?'done':p.type;
  $('#r-circuit').textContent=R.c.name;
  $('#r-phase').textContent=R.done?'¡Completado!':LABEL[p.type];
  $('#r-ex').textContent=!R.done&&p.type==='work'?exName(p.ex):'';
  $('#r-exc').textContent=`Ejercicio ${p.ex+1}/${n}`;
  $('#r-rnd').textContent=`Ronda ${p.round}/${R.c.rounds}`;
  $('#r-next').textContent=nextText();
  $('#r-state').textContent=R.running?'':(R.done?'':(R.started?'En pausa':'Listo'));
  $('#r-toggle-ic').setAttribute('href',R.running?'#i-pause':'#i-play');
  $('#r-toggle').setAttribute('aria-label',R.running?'Pausar':(R.started?'Reanudar':'Iniciar'));
  $('#r-sound').classList.toggle('off',!S.settings.sound);
  $('#r-voice').classList.toggle('off',!S.settings.voice);
  $('#r-mix').textContent=S.settings.music==='remote'?'Música: en otro altavoz':'Música: en este móvil';
  $('#r-note').textContent=S.settings.voice?'Aviso: en iPhone la voz puede pausar la música.':'';
  renderTime();}
function renderTime(){if(!R)return;const p=R.phases[R.idx],rem=remainingMs(),s=Math.ceil(rem/1000-.001);
  const t=s>=60?fmt(s):String(Math.max(0,s));const el=$('#r-time');if(el.textContent!==t){el.textContent=t;el.classList.toggle('long',s>=60);}
  $('#r-bar').style.width=(R.done?0:Math.min(100,100*(1-rem/(p.dur*1000))))+'%';
  let left=rem/1000;for(let j=R.idx+1;j<R.phases.length;j++)left+=R.phases[j].dur;
  $('#r-left').textContent=R.done?'':'Quedan '+fmt(left)+' en total';}

$('#r-toggle').onclick=()=>{if(!R)return;R.running?pause():resume();};
$('#r-skip').onclick=()=>{if(R){ensureAudio();skip();}};
$('#r-restart').onclick=()=>{if(R){ensureAudio();restartPhase();}};
function arm(btn,label,armedLabel,fn){if(btn.dataset.armed){delete btn.dataset.armed;btn.classList.remove('armed');if(label)btn.textContent=label;fn();return;}
  btn.dataset.armed='1';btn.classList.add('armed');if(armedLabel)btn.textContent=armedLabel;
  setTimeout(()=>{if(btn.dataset.armed){delete btn.dataset.armed;btn.classList.remove('armed');if(label)btn.textContent=label;}},3000);}
$('#r-reset').onclick=e=>arm(e.currentTarget,'Reiniciar todo','¿Seguro? Toca otra vez',resetAll);
$('#r-exit').onclick=e=>{if(R&&(R.running||R.started))arm(e.currentTarget,null,null,exitRun);else exitRun();};
$('#r-sound').onclick=()=>{S.settings.sound=!S.settings.sound;save();if(!S.settings.sound)cancelSounds();else{ensureAudio();scheduleAudio(true);}renderRun();};
$('#r-voice').onclick=()=>{S.settings.voice=!S.settings.voice;save();if(!S.settings.voice)stopSpeech();else ensureAudio();renderRun();};
function testSound(){ensureAudio();if(!ctx)return;const t=ctx.currentTime+.05;track=false;SND.count(t);SND.count(t+.6);SND.work(t+1.2);SND.rest(t+2.3);track=true;}
$('#r-mix').onclick=()=>{S.settings.music=S.settings.music==='remote'?'mix':'remote';save();cancelSounds();
  if(ctx){try{ctx.close();}catch(e){}ctx=null;}applySession();ensureAudio();if(R&&R.running)scheduleAudio(true);else testSound();renderRun();};
$('#btn-test').onclick=testSound;

document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;
  if(ctx)ctx.resume().catch(()=>{});
  if(R&&R.running){cancelSounds();tick();if(R&&R.running){scheduleAudio(true);lockWake();}}});

renderHome();show('home');
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!/claude|artifact/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
</script>
